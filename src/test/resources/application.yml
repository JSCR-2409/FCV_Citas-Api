spring:
  datasource:
    url: jdbc:h2:mem:citas-test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa.hibernate.ddl-auto: validate
  flyway.enabled: true
app.jwt.access-secret: test-access-secret-that-is-at-least-32-chars
app.jwt.refresh-secret: test-refresh-secret-that-is-at-least-32-chars
app.jwt.access-minutes: 15
app.jwt.refresh-days: 7
# HU-006. Las pruebas necesitan el token para verificar el consumo de un solo uso y el rechazo del
# token vencido; es el mismo canal controlado que usa el entorno de laboratorio.
app.recovery.expose-token: true
# El limite de peticiones se eleva en pruebas: las suites hacen decenas de llamadas por minuto
# desde la misma IP, y el 429 escondería el comportamiento que se quiere verificar. El limite se
# prueba aparte, en RateLimitTest, con su propio valor.
app.rate-limit.recovery-per-minute: 1000
app.rate-limit.integration-per-minute: 1000
