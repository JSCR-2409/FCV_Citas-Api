spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:citas;MODE=MySQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
app:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:development-access-secret-change-me-32}
    refresh-secret: ${JWT_REFRESH_SECRET:development-refresh-secret-change-me-32}
    access-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-days: ${JWT_REFRESH_DAYS:7}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
