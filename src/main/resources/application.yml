spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:citas;MODE=MySQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # El esquema lo crea database/reference/db.sql via init script de MySQL, por lo
    # que Flyway encuentra un esquema no vacio y hace baseline en V1. Consecuencia:
    # V1 se marca como baseline y no se ejecuta, y V3-V6 son no-ops porque usan
    # CREATE TABLE IF NOT EXISTS sobre tablas que la referencia ya creo. Solo V2
    # aplica realmente, creando refresh_sessions (ausente en la referencia).
    # Las migraciones NO son la fuente de verdad del esquema vigente.
    baseline-on-migrate: true
    baseline-version: 1
app:
  jwt:
    # Sin valor por defecto a proposito: un secreto por defecto versionado es un secreto
    # conocido. Si la variable no esta definida, la aplicacion falla al arrancar.
    access-secret: ${JWT_ACCESS_SECRET}
    refresh-secret: ${JWT_REFRESH_SECRET}
    access-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-days: ${JWT_REFRESH_DAYS:7}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:4200}
  recovery:
    # HU-006. RF-03 admite exponer el token de recuperacion por un canal controlado en desarrollo
    # porque el envio real de correo es opcional. El valor por defecto es false: si esta propiedad
    # llegara a un entorno real sin configurar, el token no se devuelve en la respuesta.
    expose-token: ${RECOVERY_EXPOSE_TOKEN:false}
  integrations:
    # HU-032 y HU-033. Sin valores por defecto: si no estan definidos, los endpoints de integracion
    # quedan cerrados y el webhook de salida no intenta ningun envio. Un token por defecto
    # versionado seria un token conocido.
    token: ${INTEGRATION_TOKEN:}
    status-webhook-url: ${STATUS_WEBHOOK_URL:}
    webhook-secret: ${STATUS_WEBHOOK_SECRET:}
